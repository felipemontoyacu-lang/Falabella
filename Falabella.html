<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falabella · Guía en tienda</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Generador de códigos QR (solo se usa en la página #qr) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>
  // Colores y fuente de la identidad Falabella para Tailwind
  tailwind.config = { theme: { extend: {
    colors: { fala: '#60A630', falad: '#4A8523', falal: '#EEF6E6' },
    fontFamily: { sans: ['Figtree', 'system-ui', 'sans-serif'] } } } };
</script>
<style>
  .qr { background:#334155; padding:4px 10px; border-radius:999px; }
  .qr:hover { background:#60A630; }
  .chip { border:1px solid #cbd5e1; background:#fff; padding:6px 14px; border-radius:999px; font-size:.85rem; font-weight:600; }
  .chip.on, .chip:hover { background:#60A630; border-color:#60A630; color:#fff; }
  .tipbtn { width:18px; height:18px; border-radius:50%; background:#60A630; color:#fff; font:700 11px/18px Figtree,sans-serif; font-style:italic; flex:none; }
  .pill { background:#60A630; color:#fff; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:999px; display:inline-block; margin-top:4px; }
  details > summary::-webkit-details-marker { display:none; }
  :focus-visible { outline:3px solid #60A630; outline-offset:2px; }
  @media print { .noprint { display:none !important; } }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body class="bg-[#F4F6F2] text-slate-800 font-sans">
 
<!-- SIMULADOR DE QR (solo para la presentación; los QR reales están en la página "Ver códigos QR") -->
<div class="bg-slate-900 text-white text-xs noprint">
  <div class="max-w-6xl mx-auto px-4 py-2 flex flex-wrap items-center gap-2">
    <span class="opacity-70">Simulador de QR:</span>
    <button class="qr" onclick="scanQR('entrada')">📷 QR de Entrada</button>
    <button class="qr" onclick="scanQR('lavadoras')">📷 QR de Lavadoras</button>
    <button class="qr" onclick="scanQR('audifonos')">📷 QR de Audífonos</button>
    <button class="qr ml-auto" onclick="go('qr')">🧾 Ver códigos QR reales</button>
  </div>
</div>
 
<header class="bg-white border-b sticky top-0 z-30 noprint">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-baseline gap-3">
    <button onclick="go('entrada')" class="text-3xl font-extrabold text-fala tracking-tight">falabella</button>
    <span class="text-sm text-slate-500">Guía en tienda</span>
  </div>
</header>
 
<main class="max-w-6xl mx-auto px-4 pb-44">
  <!-- VISTA 1: INICIO (QR de entrada) -->
  <section id="home">
    <div class="py-8">
      <h1 class="text-3xl md:text-4xl font-extrabold">¿Qué estás buscando hoy?</h1>
      <p class="text-lg md:text-xl font-bold text-falad mt-1">Tú eres quien elige. Tu elección es lo que importa.</p>
      <div class="mt-4 flex gap-2 max-w-xl">
        <input id="q" type="search" placeholder="Lavadoras, neveras, audífonos, televisores…" class="flex-1 border border-slate-300 rounded-full px-5 py-3 bg-white" onkeydown="if(event.key==='Enter')search($('q').value)">
        <button onclick="search($('q').value)" class="bg-fala hover:bg-falad text-white font-bold px-6 rounded-full">Buscar</button>
      </div>
    </div>
    <h2 class="text-xl font-extrabold mb-3">Explora por línea</h2>
    <div id="homeLines" class="grid gap-3 md:grid-cols-2 items-start"></div>
    <h2 class="text-xl font-extrabold mt-8 mb-3">⭐ Productos Estrella de la tienda</h2>
    <div id="homeStars" class="grid gap-4 md:grid-cols-4"></div>
    <div id="homeMsg"></div>
  </section>
 
  <!-- VISTA 2: LÍNEA, CATEGORÍA, QR O BÚSQUEDA SIN RESULTADOS -->
  <section id="results" class="hidden"></section>
 
  <p class="text-xs text-slate-400 mt-10 noprint">Prototipo académico. Productos, precios y ubicaciones son datos de ejemplo.</p>
</main>
 
<!-- TOOLTIP "(i)": ventana pequeña que explica un término técnico -->
<div id="tip" class="hidden fixed inset-x-4 bottom-24 mx-auto max-w-sm bg-white rounded-2xl shadow-2xl border-2 border-fala p-4 z-[60]">
  <div class="flex justify-between items-start gap-3">
    <h4 id="tipT" class="font-extrabold text-falad"></h4>
    <button onclick="$('tip').classList.add('hidden')" aria-label="Cerrar" class="text-slate-400 text-xl leading-none">×</button>
  </div>
  <p id="tipD" class="text-sm mt-1"></p>
</div>

/* ============ 5. COMPARADOR ============ */
// Calcula quién gana cada premio y qué celdas se pintan en verde.
function computeAwards(cat, list){
  const byProduct = {}, bestCells = {};
  cat.awards.forEach(a => {
    const val = p => a.k==='price' ? p.price : p.s[a.k];
    const vals = list.map(val);
    const best = a.best==='min' ? Math.min(...vals) : Math.max(...vals);
    bestCells[a.k] = best;
    list.forEach(p => { if(val(p)===best) (byProduct[p.id] = byProduct[p.id] || []).push(a.label); });
  });
  return { byProduct, bestCells };
}
 
// Tabla con los 6 productos destacados (después del filtro).
function compareTable(list){
  const cat = CATS[list[0].cat], { byProduct, bestCells } = computeAwards(cat, list);
  const cell = (isBest, txt) => `<td class="p-3 text-center border-t ${isBest?'bg-falal text-falad font-extrabold':''}">${txt}</td>`;
  const head = list.map(p => `<th class="p-3 min-w-[140px] align-top font-bold">
      <div class="text-3xl">${cat.icon}</div><div class="text-sm">${p.name}</div>
      ${(byProduct[p.id]||[]).map(l=>`<div class="pill">${l}</div>`).join('<br>')}</th>`).join('');
  const priceRow = `<tr><th class="sticky left-0 bg-white p-3 text-left text-sm border-t">Precio</th>${list.map(p=>cell(p.price===bestCells.price, money(p.price))).join('')}</tr>`;
  const rows = cat.rows.map(r => `<tr><th class="sticky left-0 bg-white p-3 text-left text-sm border-t"><span class="inline-flex items-center gap-1.5">${r.label} ${tipBtn(r.tip)}</span></th>
      ${list.map(p => cell(r.k in bestCells && p.s[r.k]===bestCells[r.k], specText(r,p))).join('')}</tr>`).join('');
  const where = `<tr><th class="sticky left-0 bg-white p-3 text-left text-sm border-t">Dónde está</th>${list.map(p=>cell(false, chLabel(p))).join('')}</tr>`;
  return `<div class="overflow-x-auto bg-white rounded-2xl border"><table class="w-full text-sm"><thead><tr><th class="sticky left-0 bg-white p-3"></th>${head}</tr></thead><tbody>${priceRow}${rows}${where}</tbody></table></div>`;
}
 
/* ============ 6. NAVEGACIÓN (cada sección tiene su propia dirección #ruta = su QR) ============ */
let fromScan = false; // true cuando la persona llegó escaneando un QR
const back = `<button onclick="go('entrada')" class="text-sm font-bold text-falad mt-4">← Volver al inicio</button>`;
const bannerHTML = t => `<div class="mt-3 bg-falal border border-fala text-falad rounded-xl px-4 py-2 text-sm font-semibold">📍 Escaneaste el QR de ${t}. Ya te llevamos directo a esta sección.</div>`;
 
// Cambia de pantalla poniendo la ruta en la dirección (así funciona el botón "atrás" y los QR).
function go(h){ location.hash === '#'+h ? route() : (location.hash = h); }
// Simula escanear un QR (el botón del simulador)
function scanQR(id){ fromScan = true; go(id); }
 
// Decide qué pantalla mostrar según la ruta. Ej: #entrada, #linea-blanca, #lavadoras, #qr
function route(){
  const h = location.hash.slice(1) || 'entrada', scanned = fromScan; fromScan = false;
  $('home').classList.toggle('hidden', h!=='entrada'); $('results').classList.toggle('hidden', h==='entrada');
  $('tip').classList.add('hidden');
  const line = LINES.find(l => l.id===h);
  if(h==='entrada') renderHome();
  else if(h==='qr') renderQR();
  else if(line) renderLine(line, scanned);
  else if(CATS[h]) showCat(h, scanned);
  else { go('entrada'); return; }
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', route);
 
// INICIO: líneas (desplegables), Productos Estrella globales y mensaje de impacto.
function renderHome(){
  $('q').value = '';
  $('homeLines').innerHTML = LINES.map(L => `<details class="bg-white rounded-2xl border p-4">

    ${L.groups.map(g => `<p class="text-xs font-bold text-slate-500 mt-3 mb-1">${g.name}</p><div class="flex flex-wrap gap-2">${g.ids.map(i=>`<button class="chip" onclick="go('${i}')">${CATS[i].icon} ${CATS[i].name}</button>`).join('')}</div>`).join('')}
    <button class="mt-4 text-sm font-bold text-falad" onclick="go('${L.id}')">Ver toda la línea</button></details>`).join('');
  const stars = PRODUCTS.filter(p=>p.star).sort((a,b)=>b.pop-a.pop).slice(0,5);
  $('homeStars').innerHTML = stars.map((p,i)=>starCard(p,i===0)).join('');
  $('homeMsg').innerHTML = msgBox('impact', 0);
}
 
// LÍNEA: muestra sus grupos y categorías.
function renderLine(L, scanned){

    `<h2 class="text-3xl font-extrabold mt-4">${L.icon} ${L.name}</h2><p class="text-slate-500">${L.desc}</p>` + msgBox('choice', 0) +
    L.groups.map(g => `<h3 class="font-extrabold mt-6 mb-2">${g.name}</h3><div class="grid gap-3 grid-cols-2 md:grid-cols-4">${g.ids.map(i => {
      const has = PRODUCTS.some(p=>p.cat===i);
      return `<button onclick="go('${i}')" class="bg-white border rounded-2xl p-4 text-left hover:border-fala"><div class="text-3xl">${CATS[i].icon}</div><div class="font-bold text-sm mt-1">${CATS[i].name}</div><div class="text-xs ${has?'text-falad':'text-slate-400'}">${has?'Disponible':'Muy pronto'}</div></button>`; }).join('')}</div>`).join('') +
    msgBox('impact', 1);
}
 
// CATEGORÍA: prepara los datos (destacados + catálogo) y la pinta.
function showCat(id, scanned){
  const all = PRODUCTS.filter(p=>p.cat===id);
  state = { cat:id, all:all.filter(p=>p.feat), extra:all.filter(p=>!p.feat), filter:0, banner: scanned ? bannerHTML(CATS[id].name) : '' };
  renderResults();
}
function setFilter(i){ state.filter = i; renderResults(); }

      <p class="text-slate-500 mt-1">Muy pronto verás aquí los productos con su información explicada fácil.</p>
      <button class="chip mt-4" onclick="go('${L.id}')">Ver toda la línea ${L.name}</button></div>` + msgBox('choice', 0);
    return;
  }
  const list = visible(), ex = visibleExtra();
  const stars = list.filter(p=>p.star).slice(0,5), rest = list.filter(p=>!stars.includes(p));
  const cols = stars.length>3 ? 'md:grid-cols-4' : 'md:grid-cols-3';
  const exT = ex.filter(p=>p.ch!=='v'), exV = ex.filter(p=>p.ch==='v'); // primero tienda física
  $('results').innerHTML = head +
    `<div class="flex flex-wrap gap-2 mt-3">${cat.filters.map((f,i)=>`<button class="chip ${i===state.filter?'on':''}" onclick="setFilter(${i})">${f.label}</button>`).join('')}</div>` +
    (!list.length && !ex.length ? `<p class="mt-8 text-slate-500">Ningún producto cumple ese filtro. Prueba con otro.</p>` : `
    ${stars.length?`<h3 class="text-xl font-extrabold mt-6 mb-3">⭐ Productos Estrella</h3><div class="grid gap-4 ${cols}">${stars.map((p,i)=>starCard(p,i===0)).join('')}</div>`:''}
    ${msgBox('choice', 1)}
    ${rest.length?`<h3 class="text-lg font-bold mb-3">Otras opciones en tienda</h3><div class="grid gap-2 md:grid-cols-2">${rest.map(miniCard).join('')}</div>`:''}
    ${list.length>1?`<h3 class="text-xl font-extrabold mt-8">Compáralos de un vistazo</h3><p class="text-sm text-slate-500 mb-3">Lo que está en verde es lo mejor de cada fila.</p>${compareTable(list)}`:''}
    ${ex.length?`<h3 class="text-xl font-extrabold mt-10">Todo lo disponible en ${cat.name}</h3>
      ${exT.length?`<p class="text-sm font-bold text-falad mt-3 mb-2">🏬 Para ver y llevar hoy en la tienda</p><div class="grid gap-2 md:grid-cols-2">${exT.map(miniCard).join('')}</div>`:''}
      ${exV.length?`<p class="text-sm font-bold text-falad mt-5 mb-2">💻 Disponibles en falabella.com.co</p><div class="grid gap-2 md:grid-cols-2">${exV.map(miniCard).join('')}</div>`:''}`:''}
    ${msgBox('choice', 2)}${msgBox('impact', 0)}`);
}
 
// BUSCADOR: reconoce líneas, categorías (por palabra clave) o productos por nombre/marca.
function search(text){
  const n = norm(text);
  if(!n){ go('entrada'); return; }
  const line = n.length>2 && LINES.find(l => norm(l.name).includes(n));
  if(line){ go(line.id); return; }
  const id = Object.keys(CATS).find(i => CATS[i].keys.some(k => n.includes(k) || (n.length>2 && k.includes(n))) || (n.length>2 && norm(CATS[i].name).includes(n)));
  if(id){ go(id); return; }
  const f = PRODUCTS.find(p => norm(p.name+' '+p.brand).includes(n));
  if(f){ go(f.cat); return; }
  // Sin resultados: mensaje claro con salida
  $('home').classList.add('hidden'); $('results').classList.remove('hidden');
  $('results').innerHTML = back + `<div class="text-center py-16"><div class="text-6xl">🔎</div>
    <h2 class="text-2xl font-extrabold mt-3">No encontramos “${text.replace(/</g,'&lt;')}”</h2><p class="text-slate-500 mt-1">Prueba explorando por línea:</p>
    <div class="mt-4 flex flex-wrap justify-center gap-2">${LINES.map(l=>`<button class="chip" onclick="go('${l.id}')">${l.icon} ${l.name}</button>`).join('')}</div></div>`;
}
 
/* ============ 7. CÓDIGOS QR REALES ============ */
// Cada QR apunta a  <dirección pública de la página>#<ruta>. Se generan aquí y se descargan en PNG.
function qrItems(){
  const items = [{ title:'Entrada de la tienda', list:[{ id:'entrada', name:'Entrada (buscador + Productos Estrella)' }] },
                 { title:'Líneas', list: LINES.map(l=>({ id:l.id, name:l.icon+' '+l.name })) }];
  LINES.forEach(l => items.push({ title:l.name+': categorías', list: l.groups.flatMap(g=>g.ids).map(i=>({ id:i, name:CATS[i].icon+' '+CATS[i].name })) }));
  return items;
}
function renderQR(){
  const base = location.href.split('#')[0], local = location.protocol==='file:';
  $('results').innerHTML = `<div class="noprint">${back}</div><h2 class="text-3xl font-extrabold mt-4">Códigos QR por sección</h2>
    <p class="text-slate-600 text-sm mt-1">Escanéalos con el celular: cada uno abre directo su sección. Imprímelos o descarga cada uno en PNG.</p>
    ${local?`<div class="mt-3 bg-amber-50 border border-amber-300 rounded-xl p-3 text-sm noprint">⚠️ Ahora la página está en tu computador, así que los QR no abrirían nada en otros celulares. Publica el archivo (por ejemplo en GitHub Pages o Netlify) y pega abajo la dirección pública.</div>`:''}
    <div class="mt-3 flex flex-wrap gap-2 noprint"><input id="qrBase" value="${base}" class="flex-1 min-w-[240px] border rounded-full px-4 py-2 text-sm" placeholder="https://tu-pagina-publica.com/index.html">
      <button class="bg-fala text-white font-bold px-5 rounded-full" onclick="drawQRs()">Actualizar QR</button>
      <button class="chip" onclick="window.print()">🖨️ Imprimir</button></div>
    <div id="qrList"></div>`;
  drawQRs();
}
function drawQRs(){
  if(typeof QRCode === 'undefined'){ $('qrList').innerHTML = '<p class="mt-6 text-red-600">No se cargó el generador de QR (revisa tu conexión a internet).</p>'; return; }
  const base = $('qrBase').value.trim().split('#')[0];
  $('qrList').innerHTML = qrItems().map(s => `<h3 class="font-extrabold mt-8 mb-3">${s.title}</h3><div class="grid gap-3 grid-cols-2 md:grid-cols-4">${s.list.map(i => `
    <div class="bg-white border rounded-2xl p-3 text-center break-inside-avoid"><div id="qr-${i.id}" class="flex justify-center"></div>
      <p class="font-bold text-sm mt-2">${i.name}</p><p class="text-[10px] text-slate-400 break-all">#${i.id}</p>
      <button class="text-xs font-bold text-falad mt-1 noprint" onclick="dlQR('${i.id}')">Descargar PNG</button></div>`).join('')}</div>`).join('');
  qrItems().forEach(s => s.list.forEach(i => new QRCode($('qr-'+i.id), { text: base+'#'+i.id, width:150, height:150, correctLevel: QRCode.CorrectLevel.M })));
}
function dlQR(id){
  const c = document.querySelector('#qr-'+id+' canvas'), a = document.createElement('a');
  a.href = c.toDataURL('image/png'); a.download = 'qr-'+id+'.png'; a.click();
}
 
/* ============ 8. TOOLTIPS (i) ============ */
// Un solo listener para todos los botones (i), incluso los que se crean después.
document.addEventListener('click', e => {
  const b = e.target.closest('.tipbtn');
  if(b){ const t = TIPS[b.dataset.tip]; $('tipT').textContent = t.t; $('tipD').textContent = t.d; $('tip').classList.remove('hidden'); return; }
  if(!e.target.closest('#tip')) $('tip').classList.add('hidden'); // tocar fuera lo cierra
});
 
/* ============ 9. CHATBOT HÍBRIDO ============ */
// Con internet y clave: responde la IA (más precisa). Sin internet: base local (limitada).
const hasAI = () => navigator.onLine && !!CONFIG.API_KEY;
function refreshMode(){
  $('mode').textContent = hasAI() ? '🟢 IA en línea' : navigator.onLine ? '🟡 Base local · toca para activar IA' : '🟠 Sin conexión · base local';
}
function setKey(){ const k = prompt('Pega tu API key para activar la IA en línea (solo demo):'); if(k){ CONFIG.API_KEY = k.trim(); refreshMode(); } }
window.addEventListener('online', refreshMode); window.addEventListener('offline', refreshMode);
 
function toggleChat(){
  const hidden = $('chat').classList.toggle('hidden'); // true = quedó oculto
  $('chat').classList.toggle('flex', !hidden); $('chatBtn').classList.toggle('hidden', !hidden);
  if(!hidden && !$('msgs').children.length) initChat();
}
function initChat(){
  $('faceH').src = FACE; refreshMode();
  addMsg('¡Hola! Soy tu asistente. Recuerda que tú decides: yo solo te ayudo a elegir con calma.', 'bot');
  const s = ['¿Cabe en un apartamento pequeño?','¿Cuál es la más barata?','¿Qué es Inverter?','¿Cuál me conviene si somos familia?'];
  $('sugg').innerHTML = s.map(t=>`<button class="chip !text-xs" onclick="sendChat(this.textContent)">${t}</button>`).join('');
}
// Agrega un mensaje (los del bot llevan la carita del personaje). Devuelve la burbuja.
function addMsg(text, who){
  const row = document.createElement('div'); row.className = 'flex gap-2 items-end ' + (who==='me' ? 'justify-end' : '');
  if(who!=='me') row.innerHTML = `<img src="${FACE}" alt="" class="w-7 h-7 rounded-full object-cover bg-falal flex-none">`;
  const b = document.createElement('div');
  b.className = who==='me' ? 'max-w-[85%] bg-fala text-white rounded-2xl rounded-br-sm px-3 py-2' : 'max-w-[85%] bg-slate-100 rounded-2xl rounded-bl-sm px-3 py-2';
  b.textContent = text; row.appendChild(b); $('msgs').appendChild(row); $('msgs').scrollTop = 1e9; return b;
}
 
// Envía la pregunta: intenta IA en línea y, si falla o no hay conexión, usa la base local.
async function sendChat(text){
  const q = (text || $('chatIn').value).trim(); if(!q) return;
  $('chatIn').value = ''; addMsg(q,'me');
  const wait = addMsg('Pensando…','bot');
  let answer = null;
  if(hasAI()){ try{ answer = await askAI(q); }catch(e){ answer = null; } }
  if(!answer) answer = offlineAnswer(q);
  if(!answer) answer = navigator.onLine
    ? 'No tengo esa respuesta en mi base. Activa la IA en línea (toca el estado arriba) o pregunta a un asesor en el pasillo.'
    : 'Sin internet no tengo esa respuesta en mi base local. Pregunta a un asesor en el pasillo o intenta de nuevo con conexión.';
  wait.textContent = answer;
}
 
// IA en línea: se le envían los productos que el cliente está viendo como contexto.
async function askAI(q){
  const src = state.cat ? [...state.all, ...state.extra] : PRODUCTS.filter(p=>p.feat);
  const ctx = src.map(p => ({ nombre:p.name, precio:p.price, categoria:p.cat, disponibilidad:chLabel(p), ...p.s }));
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':CONFIG.API_KEY, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:CONFIG.MODEL, max_tokens:400,
      system:'Eres la asistente de una tienda Falabella. Responde en español colombiano, en máximo 3 frases, con lenguaje sencillo y sin tecnicismos, y recuerda que la decisión final es del cliente. Si no sabes algo (medidas exactas, garantías, stock), dilo y sugiere preguntar a un asesor. Productos que ve el cliente: '+JSON.stringify(ctx),
      messages:[{ role:'user', content:q }] }) });
  if(!r.ok) throw new Error(r.status);
  const d = await r.json();
  return d.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
 
// Base local sin internet: reglas por palabras clave. Devuelve null si no sabe responder.
function offlineAnswer(q){
  const n = norm(q), c = state.cat, L = c ? visible() : [];
  const has = (...w) => w.some(x => n.includes(x));
  const by = (fn, dir=1) => [...L].sort((a,b)=>dir*(fn(a)-fn(b)))[0];
  // 1) Glosario: "¿qué es Inverter?"
  if(has('que es','significa','explica','quiere decir')){
    const t = Object.values(TIPS).find(t => t.alias.some(a => n.includes(a)));
    if(t) return t.t+': '+t.d;
  }
  if(!c || !L.length) return 'Elige una categoría con productos (por ahora Lavadoras o Audífonos) y te ayudo a compararlos.';
  // 2) Reglas por categoría
  if(c==='lavadoras'){
    if(has('apartamento','pequeno','espacio','cabe','compact')){ const p = by(p=>p.s.kg); return `Para poco espacio, la ${p.name} es la más compacta de la lista (${p.s.kg} kg). Confirma las medidas exactas en la etiqueta o con un asesor.`; }
    if(has('familia','grande','muchos','hijos')){ const p = by(p=>p.s.kg,-1); return `Para familia grande te sirve la ${p.name}: le caben ${p.s.kg} kg de ropa por lavada.`; }
    if(has('solo','sola','pareja','una persona','dos personas')){ const p = by(p=>p.s.kg); return `Para 1–2 personas basta la ${p.name} (${p.s.kg} kg): es la más compacta.`; }
    if(has('potente','fuerza','seca','rapido')){ const p = by(p=>p.s.rpm,-1); return `La que más exprime es la ${p.name} (${p.s.rpm} RPM): la ropa sale más seca.`; }
    if(has('ruido','silenci','luz','energia','ahorr')){ const w = L.filter(p=>p.s.inverter).map(p=>p.name); return w.length ? 'Las más silenciosas y ahorradoras tienen motor Inverter: '+w.join(', ')+'.' : 'Ninguna de las que ves tiene motor Inverter.'; }
  }
  if(c==='audifonos'){
    if(has('bateria','dura','autonomia')){ const p = by(p=>p.s.bat,-1); return `La batería más larga es la de ${p.name}: ${p.s.bat} horas.`; }
    if(has('ruido','silenci','oficina','bus','estudiar')){ const p = by(p=>p.s.anc,-1); return `Para aislarte del ruido, la mejor opción es ${p.name}.`; }
    if(has('ejercicio','gimnasio','entrenar','sudor','correr')){ const p = by(p=>p.s.ipx,-1); return `Para ejercicio busca resistencia al agua: ${p.name} es la que más protege (IPX${p.s.ipx}).`; }
  }
  if(has('barat','econom','precio','presupuesto','menos')){ const p = by(p=>p.price); return `La más económica de la lista es ${p.name}, a ${money(p.price)}.`; }
  return null;
}

route();
